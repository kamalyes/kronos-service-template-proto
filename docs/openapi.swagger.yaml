          type: object
          $ref: '#/definitions/commonBatchResult'
        title: 逐条结果 | [EN] Per-item results
    title: |-
      批量删除Product响应。
      [EN] Batch delete Product response
  catalogProductCreateRequest:
    type: object
    properties:
      tenant_id:
        type: string
        title: 租户ID | [EN] Tenant ID
      name:
        type: string
        title: 名称 | [EN] Name
        minLength: 2
        maxLength: 64
      code:
        type: string
        title: 编码 | [EN] Code
        minLength: 2
        maxLength: 32
      type:
        $ref: '#/definitions/enumsProductType'
        title: 类型 | [EN] Type
      level:
        $ref: '#/definitions/enumsProductLevel'
        title: 等级 | [EN] Level
      contact:
        $ref: '#/definitions/commonProductContact'
        title: 联系方式 | [EN] Contact
      tags:
        type: array
        items:
          type: string
        title: 标签列表 | [EN] Tag list
      remark:
        type: string
        title: 备注 | [EN] Remark
        maxLength: 255
    title: |-
      创建Product请求。
      [EN] Create Product request
      创建用裸类型 + validate:"required"，不要用 wrappers：创建场景没有「不传表示不改」的语义。
      [EN] Create uses plain types with validate:"required"; wrappers are for partial updates only
    required:
