        type: string
        title: 名称 | [EN] Name
      code:
        type: string
        title: 编码 | [EN] Code
      type:
        $ref: '#/definitions/enumsProductType'
        title: 类型 | [EN] Type
      level:
        $ref: '#/definitions/enumsProductLevel'
        title: 等级 | [EN] Level
      status:
        $ref: '#/definitions/enumsCommonStatus'
        title: 状态 | [EN] Status
      contact:
        $ref: '#/definitions/commonProductContact'
        title: 联系方式 | [EN] Contact
      tags:
        type: array
