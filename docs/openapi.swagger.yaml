          $ref: '#/definitions/enumsTenantMemberRole'
        title: 统一赋予的角色 | [EN] Roles granted to all invitees
    title: |-
      批量邀请成员请求
      [EN] Batch invite members request
  TenantMemberServiceTenantMemberRoleReplaceBody:
    type: object
    properties:
      roles:
        type: array
        items:
          $ref: '#/definitions/enumsTenantMemberRole'
        title: 覆盖后的角色集合 | [EN] The resulting role set
    title: |-
      覆盖成员角色请求
      [EN] Replace member roles request
      用 PUT 而不是 PATCH：语义是「把角色集合整体替换成这一份」，
      增量加减角色应该是另外两个动作型接口，不要用同一个接口的可选字段去表达两种语义
      [EN] PUT rather than PATCH: the semantics are "replace the whole role set with this one".
      Incremental add/remove belong to separate action endpoints instead of optional fields
      on one endpoint expressing two different behaviours
  TenantServiceTenantRegionAssignBody:
    type: object
    properties:
      region_id:
        type: string
        title: 地区ID | [EN] Region ID
      primary:
        type: boolean
        title: 是否设为主地区 | [EN] Whether to set as primary
    title: |-
      分配地区请求
      [EN] Assign region request
  TenantServiceTenantRegionAssignmentUpdateBody:
    type: object
    properties:
      primary:
        type: boolean
        title: 是否主地区 | [EN] Whether primary
    title: |-
      更新地区分配请求
      [EN] Update region assignment request
  TenantServiceTenantRetrySyncBody:
    type: object
    properties:
      force:
        type: boolean
        title: 是否强制重新同步已成功的项 | [EN] Whether to re-sync already succeeded items
    title: |-
      重试同步请求
      [EN] Retry sync request
      动作型接口也要有自己的 Request/Response，不要复用 GetRequest：
      以后加「只同步某个下游」这种参数时才有地方放
      [EN] An action endpoint needs its own request/response rather than reusing GetRequest,
      so that parameters like "sync only this downstream" have somewhere to live later
  TenantServiceTenantUpdateBody:
    type: object
    properties:
      name:
        type: string
        title: 名称 | [EN] Name
      status:
        $ref: '#/definitions/enumsTenantStatus'
        title: 状态 | [EN] Status
    title: |-
      更新Tenant请求
      [EN] Update Tenant request
  WarehouseServiceWarehouseUpdateBody:
    type: object
    properties:
      name:
        type: string
        title: 名称 | [EN] Name
      icon_url:
        type: string
        title: 图标地址 | [EN] Icon URL
      sort_order:
