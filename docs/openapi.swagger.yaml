swagger: "2.0"
info:
  title: Kronos Share Proto API
  description: kronos-service-template-proto 聚合 OpenAPI 文档，由全部业务模块的 proto 合并生成，供 TypeScript/Java/Dart 等多语言 SDK 与 API 门户消费 | Aggregated OpenAPI document of kronos-service-template-proto, merged from every business module and consumed by TypeScript/Java/Dart SDK generators and API portals
  version: 1.0.0
  contact:
    email: 501893067@qq.com
    name: kamalyes
    url: https://github.com/kamalyes/kronos-service-template-proto
tags:
  - name: ProductManagement
    description: Product 管理 | Product management
  - name: WarehouseManagement
    description: Warehouse 管理 | Warehouse management
  - name: TenantManagement
    description: Tenant 管理 | Tenant management
  - name: TenantMemberManagement
    description: Tenant 成员管理 | Tenant member management
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/catalog/products:
