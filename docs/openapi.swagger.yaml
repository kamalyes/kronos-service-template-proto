        title: 地区分配 | [EN] Region assignments
      created_at:
        type: string
        format: date-time
        title: 创建时间 | [EN] Created at
      updated_at:
        type: string
        format: date-time
        title: 更新时间 | [EN] Updated at
    title: |-
      Tenant 信息（聚合根）
      [EN] Tenant information (aggregate root)
  commonTenantMemberInfo:
    type: object
    properties:
      id:
        type: string
        title: 成员ID | [EN] Member ID
      tenant_id:
        type: string
        title: 所属TenantID | [EN] Owning Tenant ID
      user_id:
        type: string
        title: 用户ID | [EN] User ID
      display_name:
        type: string
        title: 显示名 | [EN] Display name
      email:
        type: string
        title: 邮箱 | [EN] Email
      roles:
        type: array
        items:
          $ref: '#/definitions/enumsTenantMemberRole'
        title: 角色列表 | [EN] Role list
      status:
        $ref: '#/definitions/enumsCommonStatus'
        title: 状态 | [EN] Status
      joined_at:
        type: string
        format: date-time
        title: 加入时间 | [EN] Joined at
    title: |-
      成员信息
      [EN] Member information
  commonTenantRegionAssignment:
    type: object
    properties:
      id:
        type: string
        title: 分配ID | [EN] Assignment ID
      region_id:
        type: string
        title: 地区ID | [EN] Region ID
      primary:
        type: boolean
        title: 是否主地区 | [EN] Whether primary
      assigned_at:
        type: string
        format: date-time
        title: 分配时间 | [EN] Assigned at
    title: |-
      地区分配（子资源）
      [EN] Region assignment (sub-resource)
      子资源有自己的 ID，是因为它要被单独更新和移除；只读的附属数据不需要 ID
      [EN] A sub-resource carries its own ID because it is updated and removed individually;
      read-only attached data does not need one
  commonWarehouseInfo:
    type: object
    properties:
      id:
        type: string
        title: 主键ID | [EN] Primary key ID
      tenant_id:
        type: string
        title: 租户ID | [EN] Tenant ID
      name:
        type: string
        title: 名称 | [EN] Name
      code:
        type: string
        title: 编码 | [EN] Code
      icon_url:
        type: string
        title: 图标地址 | [EN] Icon URL
      category:
        $ref: '#/definitions/enumsWarehouseCategory'
        title: 分类 | [EN] Category
      status:
        $ref: '#/definitions/enumsCommonStatus'
        title: 状态 | [EN] Status
      sort_order:
        type: integer
        format: int32
        title: 排序序号 | [EN] Sort order
      created_at:
        type: string
        format: date-time
        title: 创建时间 | [EN] Created at
      updated_at:
        type: string
        format: date-time
        title: 更新时间 | [EN] Updated at
    title: |-
      Warehouse 信息。
      [EN] Warehouse information
  enumsCommonStatus:
    type: string
    enum:
      - COMMON_STATUS_UNSPECIFIED
      - COMMON_STATUS_NORMAL
      - COMMON_STATUS_DISABLED
    default: COMMON_STATUS_UNSPECIFIED
    description: |-
      - COMMON_STATUS_UNSPECIFIED: 未指定 | [EN] Unspecified
       - COMMON_STATUS_NORMAL: 正常 | [EN] Normal
       - COMMON_STATUS_DISABLED: 禁用 | [EN] Disabled
    title: |-
      通用状态。
      [EN] Common status
      绝大多数业务实体的启用/禁用都复用这一个枚举，不要在各模块里重复定义。
      [EN] Reuse this enum for enable/disable across entities instead of redefining it per module
  enumsProductLevel:
    type: string
    enum:
      - PRODUCT_LEVEL_UNSPECIFIED
      - PRODUCT_LEVEL_BRONZE
      - PRODUCT_LEVEL_SILVER
      - PRODUCT_LEVEL_GOLD
    default: PRODUCT_LEVEL_UNSPECIFIED
    description: |-
      - PRODUCT_LEVEL_UNSPECIFIED: 未指定 | [EN] Unspecified
       - PRODUCT_LEVEL_BRONZE: 青铜 | [EN] Bronze
       - PRODUCT_LEVEL_SILVER: 白银 | [EN] Silver
       - PRODUCT_LEVEL_GOLD: 黄金 | [EN] Gold
    title: |-
      Product 等级。
      [EN] Product level
  enumsProductType:
    type: string
    enum:
      - PRODUCT_TYPE_UNSPECIFIED
      - PRODUCT_TYPE_PERSONAL
      - PRODUCT_TYPE_ORGANIZATION
    default: PRODUCT_TYPE_UNSPECIFIED
    description: |-
      - PRODUCT_TYPE_UNSPECIFIED: 未指定 | [EN] Unspecified
       - PRODUCT_TYPE_PERSONAL: 个人 | [EN] Personal
       - PRODUCT_TYPE_ORGANIZATION: 组织 | [EN] Organization
    title: |-
      Product 类型。
      [EN] Product type
  enumsTenantMemberRole:
    type: string
    enum:
      - TENANT_MEMBER_ROLE_UNSPECIFIED
      - TENANT_MEMBER_ROLE_OWNER
      - TENANT_MEMBER_ROLE_ADMIN
      - TENANT_MEMBER_ROLE_VIEWER
    default: TENANT_MEMBER_ROLE_UNSPECIFIED
    description: |-
      - TENANT_MEMBER_ROLE_UNSPECIFIED: 未指定 | [EN] Unspecified
       - TENANT_MEMBER_ROLE_OWNER: 所有者 | [EN] Owner
       - TENANT_MEMBER_ROLE_ADMIN: 管理员 | [EN] Admin
       - TENANT_MEMBER_ROLE_VIEWER: 只读 | [EN] Viewer
    title: |-
      成员角色
      [EN] Member role
  enumsTenantStatus:
    type: string
    enum:
      - TENANT_STATUS_UNSPECIFIED
      - TENANT_STATUS_PENDING
      - TENANT_STATUS_NORMAL
      - TENANT_STATUS_FROZEN
    default: TENANT_STATUS_UNSPECIFIED
    description: |-
      - TENANT_STATUS_UNSPECIFIED: 未指定 | [EN] Unspecified
       - TENANT_STATUS_PENDING: 待激活 | [EN] Pending activation
       - TENANT_STATUS_NORMAL: 正常 | [EN] Normal
       - TENANT_STATUS_FROZEN: 冻结 | [EN] Frozen
    title: |-
      Tenant 状态
      [EN] Tenant status
      聚合根有自己的状态机（待激活 -> 正常 -> 冻结），不能复用 CommonStatus 的启用/禁用两态
      [EN] The aggregate root has its own state machine (pending -> normal -> frozen), which
      the two-state CommonStatus cannot express
  enumsTenantSyncState:
    type: string
    enum:
      - TENANT_SYNC_STATE_UNSPECIFIED
      - TENANT_SYNC_STATE_PENDING
      - TENANT_SYNC_STATE_SYNCED
      - TENANT_SYNC_STATE_FAILED
    default: TENANT_SYNC_STATE_UNSPECIFIED
    description: |-
      - TENANT_SYNC_STATE_UNSPECIFIED: 未指定 | [EN] Unspecified
       - TENANT_SYNC_STATE_PENDING: 待同步 | [EN] Pending
       - TENANT_SYNC_STATE_SYNCED: 已同步 | [EN] Synced
       - TENANT_SYNC_STATE_FAILED: 同步失败 | [EN] Failed
    title: |-
      同步状态
      [EN] Sync state
      动作型接口（重试同步）用它回报结果，避免用布尔值表达三种以上的结局
      [EN] Returned by the action-style retry endpoint; a bool cannot express more than two outcomes
  enumsWarehouseCategory:
    type: string
    enum:
      - WAREHOUSE_CATEGORY_UNSPECIFIED
      - WAREHOUSE_CATEGORY_STANDARD
      - WAREHOUSE_CATEGORY_PREMIUM
    default: WAREHOUSE_CATEGORY_UNSPECIFIED
    description: |-
      - WAREHOUSE_CATEGORY_UNSPECIFIED: 未指定 | [EN] Unspecified
       - WAREHOUSE_CATEGORY_STANDARD: 标准 | [EN] Standard
       - WAREHOUSE_CATEGORY_PREMIUM: 高级 | [EN] Premium
    title: |-
      Warehouse 分类。
      [EN] Warehouse category
  inventoryWarehouseCreateRequest:
    type: object
    properties:
      tenant_id:
        type: string
        title: 租户ID | [EN] Tenant ID
      name:
        type: string
        title: 名称 | [EN] Name
        minLength: 2
        maxLength: 64
      code:
        type: string
        title: 编码 | [EN] Code
        minLength: 2
        maxLength: 32
      icon_url:
        type: string
        format: uri
        title: 图标地址 | [EN] Icon URL
      category:
        $ref: '#/definitions/enumsWarehouseCategory'
        title: 分类 | [EN] Category
      sort_order:
        type: integer
        format: int32
        title: 排序序号 | [EN] Sort order
        minimum: 0
        maximum: 9999
    title: |-
      创建Warehouse请求。
      [EN] Create Warehouse request
    required:
      - tenant_id
      - name
      - code
  inventoryWarehouseCreateResponse:
    type: object
    properties:
      info:
        $ref: '#/definitions/commonWarehouseInfo'
        title: Warehouse信息 | [EN] Warehouse info
    title: |-
      创建Warehouse响应。
