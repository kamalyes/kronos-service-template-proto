        type: boolean
        title: 是否成功 | [EN] Success
      error_message:
        type: string
        title: 失败原因 | [EN] Error message
    title: |-
      批量操作结果。
      [EN] Batch operation result
      批量接口不要用「整体成功/失败」，按条返回才能让调用方精确重试。
      [EN] Batch APIs report per-item results so callers can retry precisely
  commonGeneralEmptyResponse:
