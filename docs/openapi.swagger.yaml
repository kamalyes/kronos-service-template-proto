      排序信息。
      [EN] Sorting information
  commonTenantInfo:
    type: object
    properties:
      id:
        type: string
        title: 主键ID | [EN] Primary key ID
      code:
        type: string
        title: 编码（全局唯一）| [EN] Code, globally unique
      name:
        type: string
        title: 名称 | [EN] Name
      status:
        $ref: '#/definitions/enumsTenantStatus'
        title: 状态 | [EN] Status
      sync_state:
        $ref: '#/definitions/enumsTenantSyncState'
        title: 下游同步状态 | [EN] Downstream sync state
      platform_id:
        type: string
        title: 平台ID | [EN] Platform ID
      region_id:
        type: string
        title: 地区ID | [EN] Region ID
