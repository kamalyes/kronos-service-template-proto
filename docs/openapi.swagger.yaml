            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: tenant_id
          description: TenantID | [EN] Tenant ID
          in: path
          required: true
          type: string
        - name: assignment_id
          description: 分配ID | [EN] Assignment ID
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TenantServiceTenantRegionAssignmentUpdateBody'
      tags:
        - TenantManagement
  /v1/tenant/tenants/{tenant_id}/retry-sync:
    post:
      summary: 重试下游同步 | Retry downstream sync
      operationId: TenantService_TenantRetrySync
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/tenantTenantRetrySyncResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: tenant_id
          description: TenantID | [EN] Tenant ID
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TenantServiceTenantRetrySyncBody'
      tags:
        - TenantManagement
definitions:
  ProductServiceProductUpdateBody:
    type: object
