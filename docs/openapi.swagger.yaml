        format: int32
        title: 排序序号 | [EN] Sort order
      category:
        $ref: '#/definitions/enumsWarehouseCategory'
        title: 分类 | [EN] Category
    title: |-
      更新Warehouse请求。
      [EN] Update Warehouse request
  WarehouseServiceWarehouseUpdateStatusBody:
    type: object
    properties:
      status:
        $ref: '#/definitions/enumsCommonStatus'
        title: 状态 | [EN] Status
    title: |-
      启停Warehouse请求。
      [EN] Toggle Warehouse request
  catalogProductBatchDeleteRequest:
    type: object
    properties:
      product_ids:
        type: array
        items:
          type: string
        title: ProductID列表 | [EN] Product ID list
        maxItems: 100
    title: |-
      批量删除Product请求。
      [EN] Batch delete Product request
      批量操作走 POST + body，不用 DELETE：DELETE 带 body 在网关和代理上行为不一致。
      [EN] Batch operations use POST with a body; DELETE with a body behaves inconsistently across proxies
    required:
      - product_ids
  catalogProductBatchDeleteResponse:
    type: object
    properties:
      results:
        type: array
